<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iMac Display</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  *, *::before, *::after { cursor: none !important; }
  body { display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; }
  canvas { display: block; background: #000; flex: none; }
  /* Idle screen: calm black screen with centered message (no other UI) */
  #idle {
    position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: #000;
    display: flex; align-items: center; justify-content: center; pointer-events: none;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  #idleBox { text-align: center; transition: transform 6s ease-in-out; will-change: transform; }
  #idleMsg { color: #b4b4b4; font-size: 60px; font-size: clamp(28px, 3.1vw, 120px); font-weight: 300; letter-spacing: .01em; }
  #idleSub { color: #4a4a4a; font-size: 18px; font-size: clamp(13px, .95vw, 36px); margin-top: 1.4em; font-weight: 400; }
  #error {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font: 20px/1.5 -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; color: #fff;
    background: #600; padding: 14px 22px; border-radius: 8px; max-width: 80vw; z-index: 3; user-select: text;
  }
  #error code { background: rgba(255,255,255,.15); padding: 1px 5px; border-radius: 3px; }
  #stats {
    position: fixed; left: 8px; top: 8px; font: 12px/1.35 Menlo, Monaco, monospace; color: #0f0;
    background: rgba(0,0,0,.7); padding: 6px 9px; white-space: pre; pointer-events: none; z-index: 2;
  }
  .hidden { display: none !important; }
  .invisible { visibility: hidden !important; }
</style>
</head>
<body>
<canvas id="c" width="4096" height="2304" class="invisible"></canvas>
<div id="idle"><div id="idleBox"><div id="idleMsg">Aktuell kein aktiver Monitor</div><div id="idleSub"></div></div></div>
<div id="error" class="hidden"></div>
<div id="stats" class="hidden"></div>
<script>
"use strict";
(function () {
  // Works when served by the MacBook (http://<host>/) and as a local file on the iMac
  // (file:///.../player.html?host=10.77.0.1:8080). Target: ?host= > location.host (http/https) > default.
  var DEFAULT_HOST = "10.77.0.1:8080";
  var DEFAULT_PORT = "8080";
  var IDLE_AFTER_MS = 3000;      // no new picture for this long -> idle screen
  var DEAD_AFTER_MS = 8000;      // connected, but no message at all for this long -> reconnect
  var CONNECT_TIMEOUT_MS = 3000;
  var RECONNECT_MIN_MS = 1000, RECONNECT_MAX_MS = 2000;
  var SHIFT_EVERY_MS = 60000;    // burn-in care: move idle text every minute

  var canvas = document.getElementById("c");
  var idleEl = document.getElementById("idle");
  var idleBox = document.getElementById("idleBox");
  var idleSub = document.getElementById("idleSub");
  var errorEl = document.getElementById("error");
  var statsEl = document.getElementById("stats");
  var ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });

  function pickHost() {
    var q = null;
    try { q = new URLSearchParams(location.search).get("host"); } catch (e) {}
    if (q) {
      q = q.trim().replace(/^wss?:\/\//i, "").replace(/^https?:\/\//i, "").replace(/\/.*$/, "");
      if (/^[A-Za-z0-9.\-]+(:\d{1,5})?$/.test(q) || /^\[[0-9A-Fa-f:.]+\](:\d{1,5})?$/.test(q)) {
        if (!/:\d+$/.test(q)) q += ":" + DEFAULT_PORT;
        return q;
      }
      console.warn("Ungültiger host-Parameter:", q);
    }
    if ((location.protocol === "http:" || location.protocol === "https:") && location.host) return location.host;
    return DEFAULT_HOST;
  }
  var HOST = pickHost();
  var HOST_LABEL = HOST.replace(new RegExp(":" + DEFAULT_PORT + "$"), "");
  var WS_URL = (location.protocol === "https:" && HOST === location.host ? "wss://" : "ws://") + HOST + "/ws";

  // ---------- Layout: 1 video pixel = 1 device pixel at 2048x1152 @2x, else contain ----------
  function layout() {
    var dpr = window.devicePixelRatio || 1;
    var vw = canvas.width, vh = canvas.height;
    var devW = Math.round(window.innerWidth * dpr), devH = Math.round(window.innerHeight * dpr);
    var s = Math.min(devW / vw, devH / vh);
    var wDev = Math.round(vw * s), hDev = Math.round(vh * s);   // snap to whole device pixels
    canvas.style.width = (wDev / dpr) + "px";
    canvas.style.height = (hDev / dpr) + "px";
    canvas.style.imageRendering = (wDev === vw && hDev === vh) ? "pixelated" : "auto";
  }
  window.addEventListener("resize", layout);
  layout();

  function escapeHtml(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  // ---------- Secure context / WebCodecs check (fallback error message) ----------
  if (typeof window.VideoDecoder === "undefined" || typeof window.EncodedVideoChunk === "undefined") {
    var origin = location.protocol === "file:" ? "file://" : location.origin;
    idleEl.classList.add("hidden");
    errorEl.classList.remove("hidden");
    errorEl.innerHTML =
      "<b>WebCodecs ist nicht verfügbar.</b><br>" +
      "WebCodecs (VideoDecoder) gibt es nur in einem <i>Secure Context</i>. " +
      "<code>" + escapeHtml(origin) + "</code> ist " +
      (window.isSecureContext ? "zwar secure, aber dieser Browser kann kein WebCodecs (Google Chrome 94 oder neuer nötig)." : "kein Secure Context.") + "<br><br>" +
      "Lösung 1: Den iMac-Helfer benutzen (<code>install.command</code> bzw. <code>start.command</code>). " +
      "Er öffnet die lokale Datei <code>player.html</code> – die ist immer ein Secure Context.<br><br>" +
      "Lösung 2: <code>chrome://flags/#unsafely-treat-insecure-origin-as-secure</code> öffnen,<br>" +
      "&nbsp;&nbsp;dort <code>" + escapeHtml(origin) + "</code> eintragen, auf „Enabled“ stellen und Chrome neu starten.";
    return;
  }

  // ---------- State ----------
  var MAX_QUEUE = 4;             // decodeQueueSize above this -> drop deltas until next keyframe
  var ws = null;
  var backoff = RECONNECT_MIN_MS;
  var reconnectTimer = 0;
  var config = null;             // last config object from server
  var configKey = "";            // config the decoder was configured with
  var lastCfgKey = "";           // last config seen from server (for HW fallback reset)
  var decoder = null;
  var decoderGen = 0;
  var decoderConfig = null;      // VideoDecoderConfig actually used
  var configuring = false;
  var preferHardware = true;
  var hwFailNoOutput = 0;        // consecutive HW decoders that errored without any output
  var genOutputs = 0;            // frames output by the current decoder
  var waitingKey = true;
  var waitingSince = performance.now();
  var lastKeyReq = 0;
  var showingVideo = false;      // true = canvas visible, false = idle screen
  var lastDrawAt = 0;
  var pendingFrame = null;       // newest decoded, not yet drawn
  var rafId = 0;
  var lastMsgAt = 0;
  var unsupportedMsg = "";
  var recvTimes = new Map();     // chunk timestamp -> receive time (performance.now)

  var st = {
    framesIn: 0, bytesIn: 0, decoded: 0, drawn: 0, dropped: 0, skipped: 0, skippedRender: 0, keyReqs: 0, errors: 0,
    decLat: 0, drawLat: 0, openFrames: 0, reconnects: 0, idleSwitches: 0,
    wStart: performance.now(), wDrawn: 0, wBytes: 0, fps: 0, mbps: 0
  };

  // ---------- Idle screen / video switching ----------
  function wsOpen() { return !!ws && ws.readyState === WebSocket.OPEN; }
  function updateIdleText() {
    var t;
    if (unsupportedMsg) t = unsupportedMsg;
    else if (wsOpen()) t = "Verbunden mit MacBook " + HOST_LABEL + " – warte auf Bild …";
    else t = "Warte auf MacBook " + HOST_LABEL + " …";
    if (idleSub.textContent !== t) idleSub.textContent = t;
  }
  function clearCanvas() {
    try { ctx.fillStyle = "#000"; ctx.fillRect(0, 0, canvas.width, canvas.height); } catch (e) {}
  }
  function enterVideo() {
    if (showingVideo) return;
    showingVideo = true;
    canvas.classList.remove("invisible");
    idleEl.classList.add("hidden");
    acquireWakeLock();
  }
  function enterIdle() {
    if (pendingFrame) { closeFrame(pendingFrame); pendingFrame = null; }
    updateIdleText();
    if (!showingVideo) return;
    showingVideo = false;
    st.idleSwitches++;
    clearCanvas();                       // no frozen last frame
    canvas.classList.add("invisible");
    idleEl.classList.remove("hidden");
    releaseWakeLock();
  }
  function shiftIdleText() {
    // random offset within a safe area (viewport units -> stays valid on resize); slow transition
    var dx = (Math.random() * 2 - 1) * 16;   // vw
    var dy = (Math.random() * 2 - 1) * 22;   // vh
    idleBox.style.transform = "translate(" + dx.toFixed(1) + "vw," + dy.toFixed(1) + "vh)";
  }
  shiftIdleText();
  setInterval(shiftIdleText, SHIFT_EVERY_MS);
  updateIdleText();

  // ---------- WebSocket ----------
  function connect() {
    clearTimeout(reconnectTimer);
    reconnectTimer = 0;
    var sock;
    try { sock = new WebSocket(WS_URL); } catch (e) { console.warn("WebSocket:", e); scheduleReconnect(); return; }
    sock.binaryType = "arraybuffer";
    ws = sock;
    var connectTimeout = setTimeout(function () { if (sock.readyState === WebSocket.CONNECTING) { try { sock.close(); } catch (e) {} } }, CONNECT_TIMEOUT_MS);
    sock.onopen = function () {
      clearTimeout(connectTimeout);
      if (sock !== ws) return;
      backoff = RECONNECT_MIN_MS;
      lastMsgAt = performance.now();
      setWaiting();
      updateIdleText();
    };
    sock.onmessage = function (ev) { if (sock === ws) onMessage(ev.data); };
    sock.onerror = function () {};
    sock.onclose = function () {
      clearTimeout(connectTimeout);
      if (sock !== ws) return;
      ws = null;
      waitingKey = true;
      enterIdle();
      scheduleReconnect();
    };
  }
  function scheduleReconnect() {
    if (reconnectTimer) return;
    st.reconnects++;
    reconnectTimer = setTimeout(connect, backoff);
    backoff = Math.min(RECONNECT_MAX_MS, Math.round(backoff * 1.5));
  }
  function send(obj) {
    if (wsOpen()) { try { ws.send(JSON.stringify(obj)); } catch (e) {} }
  }
  function requestKeyframe(force) {
    var now = performance.now();
    if (!force && now - lastKeyReq < 1000) return;
    lastKeyReq = now;
    st.keyReqs++;
    send({ type: "keyframe" });
  }
  function setWaiting() {
    if (!waitingKey || !waitingSince) waitingSince = performance.now();
    waitingKey = true;
  }

  // ---------- Messages ----------
  var td = new TextDecoder();
  function onMessage(data) {
    lastMsgAt = performance.now();
    if (typeof data === "string" || !(data instanceof ArrayBuffer) || data.byteLength < 1) return;
    var type = new Uint8Array(data, 0, 1)[0];
    if (type === 0x01) {
      var cfg;
      try { cfg = JSON.parse(td.decode(new Uint8Array(data, 1))); } catch (e) { console.warn("Bad config", e); return; }
      onConfig(cfg);
    } else if (type === 0x02) {
      if (data.byteLength < 11) return;
      var dv = new DataView(data);
      var isKey = (dv.getUint8(1) & 1) === 1;
      // uint64 big-endian; two 32-bit halves (exact up to 2^53, no BigInt needed)
      var ts = dv.getUint32(2, false) * 4294967296 + dv.getUint32(6, false);
      onVideo(new Uint8Array(data, 10), isKey, ts);
    }
  }

  function onConfig(cfg) {
    if (!cfg || !cfg.codec || !cfg.width || !cfg.height) { console.warn("Incomplete config", cfg); return; }
    config = cfg;
    var key = JSON.stringify([cfg.codec, cfg.width, cfg.height]);
    if (key === configKey && decoder && decoder.state === "configured") return; // unchanged
    if (key !== lastCfgKey) { lastCfgKey = key; preferHardware = true; hwFailNoOutput = 0; }
    if (canvas.width !== cfg.width || canvas.height !== cfg.height) {
      canvas.width = cfg.width; canvas.height = cfg.height; layout();
      if (!showingVideo) clearCanvas();
    }
    setupDecoder();
  }

  function buildDecoderConfig(cfg) {
    var base = { codec: cfg.codec, codedWidth: cfg.width, codedHeight: cfg.height, optimizeForLatency: true };
    var tries = preferHardware ? ["prefer-hardware", "no-preference"] : ["no-preference"];
    var i = 0;
    function next() {
      if (i >= tries.length) return Promise.resolve(null);
      var c = Object.assign({}, base, { hardwareAcceleration: tries[i++] });
      return VideoDecoder.isConfigSupported(c).then(function (r) {
        if (r && r.supported) return c;
        console.warn("VideoDecoder config not supported:", JSON.stringify(c));
        return next();
      }, function () { console.warn("VideoDecoder config invalid:", JSON.stringify(c)); return next(); });
    }
    return next();
  }

  function setupDecoder() {
    if (!config) return Promise.resolve();
    var cfg = config;
    var gen = ++decoderGen;
    configuring = true;
    destroyDecoder();
    setWaiting();
    return buildDecoderConfig(cfg).then(function (dc) {
      if (gen !== decoderGen) return; // superseded
      configuring = false;
      if (!dc) {
        unsupportedMsg = "Video-Format wird nicht unterstützt: " + cfg.codec + " " + cfg.width + "×" + cfg.height;
        updateIdleText();
        return;
      }
      unsupportedMsg = "";
      var d = new VideoDecoder({
        output: function (frame) { onFrame(frame, gen); },
        error: function (e) { onDecoderError(e, gen); }
      });
      try { d.configure(dc); }
      catch (e) { onDecoderError(e, gen); return; }
      decoder = d;
      decoderConfig = dc;
      genOutputs = 0;
      configKey = JSON.stringify([cfg.codec, cfg.width, cfg.height]);
      setWaiting();
      console.info("VideoDecoder configured", JSON.stringify(dc));
    });
  }

  function destroyDecoder() {
    if (decoder) {
      var d = decoder;
      decoder = null;
      try { if (d.state !== "closed") d.close(); } catch (e) {}
    }
    configKey = "";
    recvTimes.clear();
  }

  function onDecoderError(e, gen) {
    if (gen !== decoderGen) return;
    st.errors++;
    console.warn("VideoDecoder error:", e && (e.message || e));
    // A hardware decoder that fails before ever producing a frame (twice in a row) probably can't handle
    // this stream (e.g. level/size too high for the GPU) -> fall back to no-preference until config changes.
    if (preferHardware && decoderConfig && decoderConfig.hardwareAcceleration === "prefer-hardware") {
      if (genOutputs === 0) hwFailNoOutput++; else hwFailNoOutput = 0;
      if (hwFailNoOutput >= 2) { preferHardware = false; console.warn("HW decoder keeps failing -> no-preference"); }
    }
    decoder = null; // already closed by the UA
    configKey = "";
    // recreate shortly, then wait for keyframe and request one
    // (slow down if this decoder never produced anything, to avoid a tight error loop)
    setTimeout(function () { if (gen === decoderGen) { setupDecoder().then(function () { requestKeyframe(true); }); } }, genOutputs ? 50 : 1000);
  }

  function onVideo(bytes, isKey, ts) {
    st.framesIn++;
    st.bytesIn += bytes.byteLength;
    st.wBytes += bytes.byteLength;
    if (configuring || !decoder) { if (!isKey) setWaiting(); st.skipped++; return; }
    if (decoder.state !== "configured") {
      // closed unexpectedly without error callback
      if (decoder.state === "closed") { decoder = null; setupDecoder().then(function () { requestKeyframe(true); }); }
      st.skipped++; return;
    }
    if (waitingKey && !isKey) {
      st.skipped++;
      if (performance.now() - waitingSince > 1200) requestKeyframe(false);
      return;
    }
    if (!isKey && decoder.decodeQueueSize > MAX_QUEUE) {
      st.dropped++;
      setWaiting();
      requestKeyframe(true);
      return;
    }
    try {
      decoder.decode(new EncodedVideoChunk({ type: isKey ? "key" : "delta", timestamp: ts, data: bytes }));
      if (recvTimes.size > 120) recvTimes.clear();
      recvTimes.set(ts, performance.now());
      if (isKey) { waitingKey = false; waitingSince = 0; }
    } catch (e) {
      onDecoderError(e, decoderGen);
    }
  }

  function onFrame(frame, gen) {
    st.openFrames++;
    // stale decoder, or connection already gone (frames still queued in the decoder) -> never draw them
    if (gen !== decoderGen || !wsOpen()) { closeFrame(frame); return; }
    st.decoded++; genOutputs++;
    var t0 = recvTimes.get(frame.timestamp);
    if (t0 !== undefined) { st.decLat = st.decLat * 0.9 + (performance.now() - t0) * 0.1; }
    if (pendingFrame) { closeFrame(pendingFrame); st.skippedRender++; }
    pendingFrame = frame;
    if (!rafId) rafId = requestAnimationFrame(draw);
    // rAF does not fire while the page is hidden/occluded -> timer fallback, so frames never pile up undrawn
    if (!drawFallbackTimer) drawFallbackTimer = setTimeout(drawFallback, 120);
  }
  var drawFallbackTimer = 0;
  function drawFallback() {
    drawFallbackTimer = 0;
    if (pendingFrame) { if (rafId) { cancelAnimationFrame(rafId); rafId = 0; } draw(); }
  }
  function closeFrame(f) { try { f.close(); } catch (e) {} st.openFrames--; }

  function draw() {
    rafId = 0;
    var f = pendingFrame;
    if (!f) return;
    pendingFrame = null;
    if (!wsOpen()) { closeFrame(f); return; }   // went idle meanwhile: keep the canvas black
    var w = f.displayWidth, h = f.displayHeight;
    if (w && h && (canvas.width !== w || canvas.height !== h)) { canvas.width = w; canvas.height = h; layout(); }
    try { ctx.drawImage(f, 0, 0, canvas.width, canvas.height); } catch (e) { console.warn("drawImage", e); }
    var t0 = recvTimes.get(f.timestamp);
    if (t0 !== undefined) { st.drawLat = st.drawLat * 0.9 + (performance.now() - t0) * 0.1; recvTimes.delete(f.timestamp); }
    closeFrame(f);
    st.drawn++; st.wDrawn++;
    lastDrawAt = performance.now();
    if (wsOpen()) enterVideo();
  }

  // ---------- Watchdog: idle switch, keyframe requests & dead connections ----------
  setInterval(function () {
    var now = performance.now();
    if (showingVideo && (!wsOpen() || now - lastDrawAt > IDLE_AFTER_MS)) enterIdle();
    if (!showingVideo) updateIdleText();
    if (wsOpen()) {
      if (waitingKey && decoder && waitingSince && now - waitingSince > 1200) requestKeyframe(false);
      var quiet = now - lastMsgAt;
      if (quiet > 4000) requestKeyframe(false);   // nothing arrives: ask for a refresh
      if (quiet > DEAD_AFTER_MS) {                // link probably dead (e.g. cable pulled) -> reconnect
        console.warn("Keine Daten seit " + Math.round(quiet / 1000) + " s -> neu verbinden");
        var s = ws;
        ws = null;
        try { s.close(); } catch (e) {}
        waitingKey = true;
        enterIdle();
        scheduleReconnect();
      }
    } else if (!ws && !reconnectTimer) {
      scheduleReconnect();                        // safety net: never stop reconnecting
    }
  }, 250);

  // ---------- Stats ----------
  function updateWindow() {
    var now = performance.now(), dt = (now - st.wStart) / 1000;
    if (dt >= 1) {
      st.fps = st.wDrawn / dt; st.mbps = st.wBytes * 8 / 1e6 / dt;
      st.wDrawn = 0; st.wBytes = 0; st.wStart = now;
    }
  }
  setInterval(function () {
    updateWindow();
    if (!statsEl.classList.contains("hidden")) {
      statsEl.textContent =
        "state    " + (showingVideo ? "video" : "idle") + "  ws " + (ws ? ["connecting", "open", "closing", "closed"][ws.readyState] : "-") + "  " + WS_URL + "\n" +
        "fps      " + st.fps.toFixed(1) + "\n" +
        "Mbit/s   " + st.mbps.toFixed(1) + "\n" +
        "queue    " + (decoder ? decoder.decodeQueueSize : "-") + "\n" +
        "dropped  " + st.dropped + "  skipped " + st.skipped + "  render-skip " + st.skippedRender + "\n" +
        "decode   " + st.decLat.toFixed(1) + " ms  draw " + st.drawLat.toFixed(1) + " ms (recv→)\n" +
        "frames   in " + st.framesIn + " dec " + st.decoded + " drawn " + st.drawn + " open " + st.openFrames + "\n" +
        "keyreq   " + st.keyReqs + "  errors " + st.errors + "  reconn " + st.reconnects + "  idle " + st.idleSwitches + "\n" +
        "video    " + (config ? config.codec + " " + config.width + "x" + config.height + "@" + (config.fps || "?") : "-") + "\n" +
        "decoder  " + (decoderConfig ? decoderConfig.hardwareAcceleration : "-") + " " + (decoder ? decoder.state : "none") + (waitingKey ? " (wait key)" : "") + "\n" +
        "view     " + innerWidth + "x" + innerHeight + " @" + devicePixelRatio + "  canvas css " + canvas.style.width + " x " + canvas.style.height;
    }
  }, 500);
  setInterval(function () {
    if (!showingVideo) return;
    send({
      type: "stats",
      fps: Math.round(st.fps * 10) / 10,
      decodeQueue: decoder ? decoder.decodeQueueSize : 0,
      dropped: st.dropped,
      mbps: Math.round(st.mbps * 10) / 10,
      decodeMs: Math.round(st.decLat * 10) / 10,
      drawMs: Math.round(st.drawLat * 10) / 10,
      keyframeRequests: st.keyReqs,
      errors: st.errors,
      hw: decoderConfig ? decoderConfig.hardwareAcceleration : null
    });
  }, 5000);

  // ---------- Input: stats toggle, fullscreen ----------
  window.addEventListener("keydown", function (e) {
    if (e.key === "s" || e.key === "S") statsEl.classList.toggle("hidden");
    else if (e.key === "f" || e.key === "F") toggleFullscreen();
  });
  window.addEventListener("dblclick", toggleFullscreen);
  window.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  function toggleFullscreen() {
    try {
      if (document.fullscreenElement) document.exitFullscreen().catch(function () {});
      else document.documentElement.requestFullscreen().catch(function () {});
    } catch (e) {}
  }

  // ---------- Screen Wake Lock: only while a picture is shown (idle -> normal display sleep) ----------
  var wakeLock = null;
  function acquireWakeLock() {
    try {
      if (showingVideo && navigator.wakeLock && document.visibilityState === "visible" && !wakeLock) {
        navigator.wakeLock.request("screen").then(function (l) {
          if (!showingVideo) { l.release().catch(function () {}); return; }
          wakeLock = l;
          l.addEventListener("release", function () { if (wakeLock === l) wakeLock = null; });
        }, function () {});
      }
    } catch (e) { /* ignore */ }
  }
  function releaseWakeLock() {
    var l = wakeLock;
    wakeLock = null;
    if (l) { try { l.release().catch(function () {}); } catch (e) {} }
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") { acquireWakeLock(); requestKeyframe(false); }
  });
  setInterval(acquireWakeLock, 30000);

  // debug hook for testing
  window.__display = {
    st: st, host: HOST, wsUrl: WS_URL, requestKeyframe: requestKeyframe,
    get decoder() { return decoder; }, get ws() { return ws; },
    get showingVideo() { return showingVideo; }, get idleText() { return document.getElementById("idleMsg").textContent; }
  };

  connect();
})();
</script>
</body>
</html>
